version: "2"

linters:
  default: standard
  enable:
    - gosec
    - revive

  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: unused-parameter

  exclusions:
    rules:
      - linters: [staticcheck]
        text: "QF1001|QF1008"

      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/hnw/compose-policy-proxy
